# SonarQube Cloud scan on every push and pull request.
# Requires repo secret SONAR_TOKEN (https://sonarcloud.io/account/security/).
# Project config: sonar-project.properties (org vincenttisseront / key vincenttisseront_esos-webui).
#
# Prefer CI analysis over SonarCloud Automatic Analysis for this repo so
# sonar.exclusions / tsconfig.sonar.json are honored.

name: SonarCloud

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: sonarcloud-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Install deps for better JS/TS type resolution (no native rebuild needed for scan).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
