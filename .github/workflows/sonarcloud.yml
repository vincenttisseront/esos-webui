# SonarQube Cloud — same org binding as bastion-app (GitHub ALM).
# Project: vincenttisseront_esos-webui / sonar-project.properties
#
# Preferred (like bastion-app): enable Automatic Analysis in SonarCloud UI
#   Administration → Analysis Method → Automatic Analysis = ON
# Optional CI token scan: set repo secret SONAR_TOKEN (sonarcloud.io/account/security).

name: SonarCloud

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: sonarcloud-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Install deps for better JS/TS type resolution (no native rebuild needed for scan).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
