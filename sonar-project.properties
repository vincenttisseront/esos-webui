# SonarQube Cloud — esos-webui (Nuxt / Vue / TypeScript)
# https://sonarcloud.io/project/overview?id=vincenttisseront_esos-webui
sonar.projectKey=vincenttisseront_esos-webui
sonar.projectName=esos-webui
sonar.organization=vincenttisseront
sonar.projectVersion=1.0.10

sonar.sources=.
sonar.tests=tests
sonar.sourceEncoding=UTF-8

sonar.exclusions=\
  node_modules/**,\
  .nuxt/**,\
  .output/**,\
  .data/**,\
  coverage/**,\
  dist/**,\
  public/**,\
  keys/**,\
  .secrets/**,\
  **/*.min.js,\
  package-lock.json,\
  i18n/locales/**,\
  docs/**

sonar.test.inclusions=tests/**/*.ts,tests/**/*.js

sonar.coverage.exclusions=\
  **/*.vue,\
  nuxt.config.*,\
  middleware/**,\
  plugins/**,\
  server/db/migrations/**,\
  scripts/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Sonar embeds TypeScript ≤6.0.3; project may use TS 7 + Nuxt-generated tsconfig.
# Point analysis at a standalone config without .nuxt extends / unsupported options.
sonar.typescript.tsconfigPaths=tsconfig.sonar.json
