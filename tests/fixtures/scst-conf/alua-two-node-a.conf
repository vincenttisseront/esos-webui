# ESOS implicit ALUA — node A (primary pattern)
# Reference: ESOS wiki ALUA Configuration

HANDLER vdisk_blockio {
    DEVICE linux_vol {
        filename /dev/vg0/lv0
    }
    DEVICE data_vol {
        filename /dev/vg0/lv1
    }
}

TARGET_DRIVER iscsi {
    TARGET iqn.2024-01.com.esos:node-a {
        rel_tgt_id 101
        enabled 1
    }
    TARGET iqn.2024-01.com.esos:node-b {
        rel_tgt_id 102
        enabled 1
    }
}

DEVICE_GROUP esos {
    DEVICE linux_vol
    DEVICE data_vol
    TARGET_GROUP local {
        group_id 1
        TARGET iqn.2024-01.com.esos:node-a
    }
    TARGET_GROUP remote {
        group_id 2
        TARGET iqn.2024-01.com.esos:node-b
    }
}
