name: esos-webui

services:
  app:
    image: esos-webui:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        # Omit host APP_VERSION for Compose builds to fall back to package.json in the image.
        APP_VERSION: ${APP_VERSION:-}
        BUILD_ID: ${BUILD_ID:-}
        GIT_COMMIT: ${GIT_COMMIT:-}
        GIT_BRANCH: ${GIT_BRANCH:-}
        BUILD_DATE: ${BUILD_DATE:-}
    container_name: esos-webui-app
    restart: unless-stopped

    # Sensitive values come from .env (never inlined here)
    env_file:
      - .env

    # SSH private key mounted read-only + persistance SQLite multi-SAN (v2.0)
    volumes:
      - ./keys/esos_rsa:/app/keys/esos_rsa:ro
      - db-data:/app/data
      - ./binaries:/opt/esos-webui/binaries:ro

    networks:
      - esos-internal

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  proxy:
    image: nginx:alpine
    container_name: esos-webui-proxy
    restart: unless-stopped

    depends_on:
      - app

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

    networks:
      - esos-internal

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  esos-internal:
    driver: bridge
    internal: false

volumes:
  db-data:
    driver: local
